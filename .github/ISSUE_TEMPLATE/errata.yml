name: Errata (Normative defect)
description: Report a normative defect in the standard text.
title: "ERRATA: <short summary>"
labels: ["errata"]
body:
  - type: input
    id: rfc
    attributes:
      label: Affected document
      placeholder: "RFC0001 / RFC0002 / RFC0003"
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section / location
      placeholder: "e.g., Section 3.2, paragraph 2"
    validations:
      required: true
  - type: textarea
    id: defect
    attributes:
      label: Defect description (normative)
      description: What is wrong and why it is objectively incorrect.
    validations:
      required: true
  - type: textarea
    id: proposed_fix
    attributes:
      label: Proposed correction
      description: Minimal text change.
    validations:
      required: true
